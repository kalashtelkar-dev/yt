<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=robots content=noindex><title>GEO Dismantled</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#120e0b;color:#f4eadb;font:15px system-ui,sans-serif}form{display:grid;gap:12px;width:min(320px,88vw)}h1{margin:0 0 6px;font-size:22px}
input,button{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid #33281f;background:#1d1611;color:inherit}button{cursor:pointer;border-color:#e8b64a;color:#e8b64a}#e{color:#e5604a;min-height:1.2em}</style>
<form id=f><h1>GEO Dismantled</h1><input id=p type=password placeholder=Password autocomplete=current-password autofocus><button>Enter</button><div id=e></div></form>
<script>f.onsubmit=async x=>{x.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:p.value})});if(r.ok)location='/';else e.textContent=(await r.json().catch(()=>({}))).error||'error'}</script>
